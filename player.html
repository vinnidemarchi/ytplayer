<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#p{width:100%;height:100%}
iframe{pointer-events:none}
</style>
</head>
<body>
<div id="p"></div>
<script>
const id = new URLSearchParams(location.search).get("v");
const send = t => parent.postMessage({ ytAutoplay: t }, "*");
function onYouTubeIframeAPIReady() {
  new YT.Player("p", {
    width: "100%",
    height: "100%",
    videoId: id,
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, iv_load_policy: 3, origin: location.origin },
    events: {
      onReady: e => e.target.playVideo(),
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) send("ended"); },
      onError: () => send("error")
    }
  });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
